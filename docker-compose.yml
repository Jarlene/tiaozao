services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tiaozao
      POSTGRES_PASSWORD: tiaozao123
      POSTGRES_DB: tiaozao
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tiaozao"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: "8080"
      DATABASE_URL: "postgres://tiaozao:tiaozao123@postgres:5432/tiaozao?sslmode=disable"
      IMAGE_DIR: /app/uploads
      IMAGE_BASE_URL: http://localhost:8080/uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
