<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>发布商品 - 跳蚤市场</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a href="/" class="brand">跳蚤市场</a>
      <div class="nav-links">
        <a href="/">首页</a>
        <a href="/publish.html">发布商品</a>
      </div>
    </div>
  </nav>
  <main class="container">
    <h1>发布商品</h1>
    <form id="publishForm" class="product-form">
      <div class="form-group">
        <label for="title">商品标题 *</label>
        <input type="text" id="title" required maxlength="200" placeholder="输入商品标题">
      </div>
      <div class="form-group">
        <label for="category">分类</label>
        <select id="category"></select>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="price">价格 *</label>
          <input type="number" id="price" required min="0" step="0.01" placeholder="0.00">
        </div>
        <div class="form-group">
          <label for="originalPrice">原价</label>
          <input type="number" id="originalPrice" min="0" step="0.01" placeholder="0.00">
        </div>
      </div>
      <div class="form-group">
        <label for="description">商品描述</label>
        <textarea id="description" rows="5" placeholder="描述你的商品..."></textarea>
      </div>
      <div class="form-group">
        <label>商品图片</label>
        <div class="image-upload-area" id="dropZone">
          <p>点击或拖拽图片到此区域上传</p>
          <input type="file" id="fileInput" accept="image/*" multiple style="display:none">
        </div>
        <div id="imagePreview" class="image-preview"></div>
      </div>
      <button type="submit" class="btn-primary">发布商品</button>
    </form>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
